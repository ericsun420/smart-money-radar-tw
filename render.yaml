services:
  - type: web
    name: smart-money-radar-tw
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /render-health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SMART_MONEY_CORS_ORIGINS
        value: "https://smart-money-radar-tw.onrender.com,http://127.0.0.1:8000,http://localhost:8000"
      - key: SMART_MONEY_PREFER_MCP_PROXY
        value: "0"
      - key: SMART_MONEY_ENABLE_MCP_PROXY
        value: "0"
      - key: SMART_MONEY_ACCESS_TOKEN
        sync: false
      - key: SMART_MONEY_ADMIN_TOKEN
        sync: false
