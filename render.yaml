services:
  - type: web
    name: smart-money-radar-tw
    env: python
    region: singapore
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: SMART_MONEY_CORS_ORIGINS
        value: "*"
      - key: SMART_MONEY_ACCESS_TOKEN
        sync: false
      - key: SMART_MONEY_ADMIN_TOKEN
        sync: false
